---
name: "CI"
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
  test:
    uses: ./.github/workflows/python.yml
    needs: [pre-commit]
  frontend:
    uses: ./.github/workflows/frontend-build-and-test.yml
